<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HealthCare CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <!-- Left panel -->
    <div class="login-left">
      <div class="login-brand">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
            <path d="M11 6h2v2h-2zM11 16h2v2h-2z" opacity="0"/>
            <path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4z"/>
          </svg>
        </div>
        <h1>HealthCare CRM</h1>
        <p>Advanced Patient &amp; Practice Management System</p>
      </div>

      <div class="login-features">
        <div class="login-feature-item">
          <div class="fi-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span>Comprehensive patient records &amp; history</span>
        </div>
        <div class="login-feature-item">
          <div class="fi-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <span>Smart appointment scheduling</span>
        </div>
        <div class="login-feature-item">
          <div class="fi-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="1" x2="12" y2="23"/>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <span>Integrated billing &amp; invoicing</span>
        </div>
        <div class="login-feature-item">
          <div class="fi-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          </div>
          <span>Real-time analytics &amp; reports</span>
        </div>
      </div>
    </div>

    <!-- Right panel: login form -->
    <div class="login-right">
      <div class="login-form-wrap">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <div class="mb-3">
          <label class="form-label">Email address</label>
          <div class="input-group-custom">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input class="form-control" type="email" placeholder="doctor@hospital.com" id="loginEmail">
          </div>
        </div>

        <div class="mb-3">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <label class="form-label" style="margin-bottom:6px;">Password</label>
            <a href="#" style="font-size:12px;color:var(--teal);text-decoration:none;font-weight:500;">Forgot password?</a>
          </div>
          <div class="input-group-custom">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input class="form-control" type="password" placeholder="••••••••" id="loginPassword">
          </div>
        </div>

        <div class="mb-3 d-flex align-items-center gap-2">
          <input type="checkbox" id="rememberMe" class="form-check-input" style="margin:0;">
          <label for="rememberMe" style="font-size:13px;color:var(--muted);cursor:pointer;">Remember me for 30 days</label>
        </div>

        <button class="btn btn-primary w-100 py-2" onclick="login()">Sign in to Dashboard</button>

        <div class="login-footer-link mt-3">
          Don't have an account? <a href="register.html">Create account</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
