<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — HealthCare CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-left">
      <div class="login-brand">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4z"/></svg>
        </div>
        <h1>HealthCare CRM</h1>
        <p>Join thousands of healthcare professionals managing their practice smarter.</p>
      </div>
      <div class="login-features">
        <div class="login-feature-item">
          <div class="fi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
          <span>Free 30-day trial, no credit card required</span>
        </div>
        <div class="login-feature-item">
          <div class="fi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
          <span>HIPAA-compliant data storage</span>
        </div>
        <div class="login-feature-item">
          <div class="fi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
          <span>24/7 dedicated support</span>
        </div>
      </div>
    </div>

    <div class="login-right">
      <div class="login-form-wrap">
        <h2>Create account</h2>
        <p class="subtitle">Get started with HealthCare CRM today</p>

        <div class="mb-3">
          <label class="form-label">Full name</label>
          <div class="input-group-custom">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="form-control" type="text" placeholder="Dr. Jane Smith" id="regName">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email address</label>
          <div class="input-group-custom">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input class="form-control" type="email" placeholder="doctor@hospital.com" id="regEmail">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Role</label>
          <select class="form-select" id="regRole">
            <option value="">Select your role</option>
            <option>Physician</option>
            <option>Nurse</option>
            <option>Administrator</option>
            <option>Receptionist</option>
            <option>Billing Specialist</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group-custom">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="form-control" type="password" placeholder="Min. 8 characters" id="regPassword">
          </div>
        </div>

        <button class="btn btn-success w-100 py-2" onclick="registerUser()">Create my account</button>

        <div class="login-footer-link mt-3">
          Already have an account? <a href="index.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
